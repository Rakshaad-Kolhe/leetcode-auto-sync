<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DevPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-container">

      <!-- 1. HEADER (Avatar + Username left / Icons right - Shared) -->
      <header id="header-container">
        <!-- Rendered by HeaderComponent -->
      </header>

      <!-- DASHBOARD VIEW -->
      <div id="dashboard-view" class="tab-view active">
        <!-- 0. STREAK BANNER -->
        <div id="streak-banner-container">
          <!-- Rendered by StreakBannerComponent (conditionally shown) -->
        </div>

        <!-- 2. STATS BAR (4-Column: Solved / Easy / Med / Hard) -->
        <section id="today-hero-container" aria-labelledby="solved-summary-title">
          <!-- Rendered by SolvedSummaryComponent / TodayHeroComponent -->
        </section>

        <!-- 3. 30-DAY ACTIVITY HEATMAP -->
        <section id="heatmap-container" aria-labelledby="heatmap-title">
          <!-- Rendered by ActivityHeatmapComponent / HeatmapComponent -->
        </section>

        <!-- 4. YOUR PROGRESS -->
        <section id="progress-container" aria-labelledby="progress-title">
          <!-- Rendered by ProgressComponent -->
        </section>

        <!-- 5. DAILY CHALLENGE -->
        <section id="daily-challenge-container" aria-labelledby="challenge-title">
          <!-- Rendered by DailyChallengeComponent -->
        </section>

        <!-- 6. PROBLEMS EXPLORER -->
        <section id="next-action-container" aria-labelledby="next-action-title">
          <!-- Rendered by ProblemsExplorerComponent / NextActionComponent -->
        </section>
      </div>

      <!-- ACTIVITY VIEW -->
      <div id="activity-view" class="tab-view" style="display: none;">
        <section id="activity-screen-container" aria-label="Activity Screen">
          <!-- Rendered by ActivityScreenComponent -->
        </section>
      </div>

      <!-- ANALYTICS VIEW -->
      <div id="analytics-view" class="tab-view" style="display: none;">
        <section id="analytics-screen-container" aria-label="Analytics Screen">
          <!-- Rendered by AnalyticsScreenComponent -->
        </section>
      </div>

      <!-- REPO VIEW -->
      <div id="repo-view" class="tab-view" style="display: none;">
        <section id="repo-screen-container" aria-label="Repo Screen">
          <!-- Rendered by RepoScreenComponent -->
        </section>
      </div>

      <!-- DIAGNOSTICS VIEW -->
      <div id="diagnostics-view" class="tab-view" style="display: none;">
        <section id="diagnostics-screen-container" aria-label="Diagnostics Screen">
          <!-- Rendered by DiagnosticsScreenComponent -->
        </section>
      </div>

      <!-- SETTINGS VIEW -->
      <div id="settings-view" class="tab-view" style="display: none;">
        <section id="settings-screen-container" aria-label="Settings Screen">
          <!-- Rendered by SettingsScreenComponent -->
        </section>
      </div>

      <!-- 7. BOTTOM NAVIGATION (Shared) -->
      <footer id="status-footer-container">
        <!-- Rendered by BottomNavigationComponent / StatusFooterComponent -->
      </footer>

    </main>

    <!-- Core Dependencies -->
    <script src="../shared/constants.js"></script>
    <script src="../shared/logger.js"></script>
    <script src="../models/metadata_snapshot.js"></script>
    <script src="../models/submission_model.js"></script>
    <script src="../models/accepted_submission.js"></script>
    <script src="../models/developer_intelligence.js"></script>
    <script src="../models/developer_report.js"></script>
    <script src="../models/skill_tree.js"></script>
    <script src="../models/knowledge_graph.js"></script>
    <script src="../models/achievement.js"></script>
    <script src="../models/roadmap.js"></script>
    <script src="../models/milestone.js"></script>
    <script src="../models/projection.js"></script>
    <script src="../models/developer_view_model.js"></script>
    <script src="../models/diagnostic_models.js"></script>
    <script src="../domain/data_provenance.js"></script>
    <script src="../domain/developer_data_store.js"></script>
    <script src="../domain/diagnostic_event_store.js"></script>
    <script src="../domain/developer_settings_store.js"></script>

    <!-- Parsers & Services -->
    <script src="../parser/metadata_parser.js"></script>
    <script src="../parser/solution_parser.js"></script>
    <script src="../services/metadata_service.js"></script>
    <script src="../services/solution_service.js"></script>
    <script src="../services/backend_service.js"></script>
    <script src="../services/authentication_service.js"></script>
    <script src="../services/data_normalization_service.js"></script>
    <script src="../services/canonical_identity_resolver.js"></script>
    <script src="../services/metric_validation_service.js"></script>
    <script src="../services/leetcode_graphql_service.js"></script>
    <script src="../services/company_tags_dataset_service.js"></script>
    <script src="../services/curated_lists_dataset_service.js"></script>
    <script src="../services/curated_lists_service.js"></script>
    <script src="../services/repository_scanner_service.js"></script>
    <script src="../services/repository_health_calculator.js"></script>
    <script src="../services/snapshot_engine_service.js"></script>
    <script src="../services/developer_view_model_builder.js"></script>
    <script src="../services/extension_icon_service.js"></script>
    <script src="../services/diagnostics_service.js"></script>
    <script src="../intelligence/skill_tree_service.js"></script>
    <script src="../intelligence/journey_service.js"></script>
    <script src="../intelligence/pattern_service.js"></script>
    <script src="../intelligence/interview_matrix_service.js"></script>
    <script src="../intelligence/interview_intelligence_service.js"></script>
    <script src="../intelligence/recommendation_service.js"></script>
    <script src="../intelligence/achievement_service.js"></script>
    <script src="../intelligence/projection_service.js"></script>
    <script src="../intelligence/repository_audit_service.js"></script>
    <script src="../intelligence/developer_intelligence_service.js"></script>

    <!-- Analytics Engine -->
    <script src="../analytics/analytics_models.js"></script>
    <script src="../analytics/skill_analyzer.js"></script>
    <script src="../analytics/recommendation_engine.js"></script>
    <script src="../analytics/analytics_engine.js"></script>

    <!-- UI Components -->
    <script src="../ui/components/streak_banner_component.js"></script>
    <script src="../ui/components/header_component.js"></script>
    <script src="../ui/components/solved_summary_component.js"></script>
    <script src="../ui/components/today_hero_component.js"></script>
    <script src="../ui/components/problems_explorer_component.js"></script>
    <script src="../ui/components/next_action_component.js"></script>
    <script src="../ui/components/progress_component.js"></script>
    <script src="../ui/components/activity_heatmap_component.js"></script>
    <script src="../ui/components/heatmap_component.js"></script>
    <script src="../ui/components/daily_challenge_component.js"></script>
    <script src="../ui/components/bottom_navigation_component.js"></script>
    <script src="../ui/components/status_footer_component.js"></script>
    <script src="../ui/components/activity_screen_component.js"></script>
    <script src="../ui/components/analytics_screen_component.js"></script>
    <script src="../ui/components/repo_screen_component.js"></script>
    <script src="../ui/components/diagnostics_screen_component.js"></script>
    <script src="../ui/components/settings_screen_component.js"></script>

    <!-- Entry -->
    <script src="popup.js"></script>
  </body>
</html>
